# Замените app на имя из вывода `fly apps list` или при `fly launch`
app = "sharescription-api"
# Список кодов: fly platform regions (например ams, fra, arn)
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Том для SQLite (регион = primary_region): fly volumes create data --region ams --size 1
[[mounts]]
  source = "data"
  destination = "/data"
